name: CI

on:
  push:
    branches:
      - modernisation/2026
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Mern_CarCollection_DataBase

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install API dependencies
        run: npm install --no-audit --no-fund

      - name: Test API CRUD flow
        run: npm test

      - name: Install client dependencies
        run: npm install --prefix client --no-audit --no-fund

      - name: Test client
        run: npm test --prefix client -- --runInBand
        env:
          CI: true

      - name: Build client
        run: npm run build --prefix client
        env:
          CI: true
